<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
            text-align:center;
        }

        h1{
            color:#333;
        }

        form{
            margin:20px;
        }

        input{
            padding:8px;
            margin:5px;
        }

        button{
            padding:8px 15px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
        }

        table{
            width:70%;
            margin:auto;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid black;
            padding:10px;
        }

        th{
            background:#4CAF50;
            color:white;
        }

        a{
            color:red;
            text-decoration:none;
        }

    </style>

</head>

<body>

<h1>Student Management System</h1>

<form action="/add" method="POST">

<input type="text" name="name" placeholder="Student Name" required>

<input type="text" name="branch" placeholder="Branch" required>

<input type="text" name="year" placeholder="Year" required>

<button>Add Student</button>

</form>

<table>

<tr>

<th>Name</th>
<th>Branch</th>
<th>Year</th>
<th>Action</th>

</tr>

{% for student in students %}

<tr>

<td>{{ student.name }}</td>

<td>{{ student.branch }}</td>

<td>{{ student.year }}</td>

<td>

<a href="/delete/{{ loop.index0 }}">Delete</a>

</td>

</tr>

{% endfor %}

</table>

</body>
</html>
